# Builds HTML-Lower-Thirds-Windows.exe and HTML-Lower-Thirds-Linux and publishes them as a GitHub release.
#
# To publish a new version: change "version" in package.json and push to main.
# The release is tagged v<version> (for example v0.2.0). 0.x versions, and versions with a dash
# like 1.0.0-beta, are marked as pre-releases. Pushing a tag like v0.2.0 works too.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Publish if this version hasn't been released yet
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            publish=false
          else
            publish=true
          fi
          [[ "$GITHUB_REF" == refs/tags/* ]] && publish=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$version" == 0.* || "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          echo "Version $version, publish=$publish"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: HTML-Lower-Thirds.exe
            asset: HTML-Lower-Thirds-Windows.exe
          - os: ubuntu-latest
            file: HTML-Lower-Thirds
            asset: HTML-Lower-Thirds-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Smoke test (starts and serves the control panel)
        shell: bash
        run: |
          export LT_DATA_DIR="$RUNNER_TEMP/lt-data"
          "dist/${{ matrix.file }}" &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q "Lower Thirds"
          curl -sf http://localhost:3000/overlay.html | grep -q "tpl-lyrics"
          curl -sf http://localhost:3000/api/songs | grep -q "Amazing Grace"
          test -f "$LT_DATA_DIR/Leadership.txt"
          kill %1 || true
      - run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HTML Lower Thirds ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: out/*
