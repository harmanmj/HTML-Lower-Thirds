# Builds HTML-Lower-Thirds.exe (Windows) and HTML-Lower-Thirds (Linux) and attaches them to a GitHub release.
# To publish:  create a tag like v0.2.0 (git tag v0.2.0 && git push --tags), or run this workflow by hand.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: HTML-Lower-Thirds.exe
            asset: HTML-Lower-Thirds-Windows.exe
          - os: ubuntu-latest
            file: HTML-Lower-Thirds
            asset: HTML-Lower-Thirds-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Smoke test (starts and serves the control panel)
        shell: bash
        run: |
          export LT_DATA_DIR="$RUNNER_TEMP/lt-data"
          "dist/${{ matrix.file }}" &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q "Lower Thirds"
          curl -sf http://localhost:3000/overlay.html | grep -q "tpl-lyrics"
          curl -sf http://localhost:3000/api/songs | grep -q "Amazing Grace"
          test -f "$LT_DATA_DIR/Leadership.txt"
          kill %1 || true
      - run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          # 0.x versions and tags like v1.2.0-beta are published as pre-releases
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
